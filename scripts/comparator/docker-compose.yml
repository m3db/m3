services:
  m3comparator:
    expose:
      - "9000"
      - "9001"
    # 9000 (gRPC) is only dialled by m3query inside the compose network; 9001
    # (HTTP seed) is what the test process on the host needs.
    ports:
      - "0.0.0.0:9001:9001"
    networks:
      - backend
    image: "m3comparator:${REVISION}"
  m3query:
    expose:
      - "7201"
      - "7203"
    ports:
      - "0.0.0.0:7201:7201"
      - "0.0.0.0:7203:7203"
    networks:
      - backend
    image: "m3query:${REVISION}"
  prometheus:
    expose:
      - "9090"
    ports:
      - "0.0.0.0:9090:9090"
    networks:
      - backend
    image: prom/prometheus:v2.31.2
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
  grafana:
    build:
      context: ./grafana
      dockerfile: grafana.Dockerfile
    expose:
      - "3000"
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - backend
    image: m3grafana:latest
networks:
  backend:
